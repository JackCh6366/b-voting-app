<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>投票管理後台</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div style="margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
      <a href="/" style="text-decoration: none; font-size: 13px; font-weight: 600; color: #4f46e5;">← 回到系統首頁</a>
      <div id="adminAuthStatusArea" style="display: flex; align-items: center; gap: 8px;">
        <span id="adminAuthBadge" style="font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 9999px; background: #fef2f2; color: #991b1b; border: 1px solid #fecaca;">🔒 未解鎖</span>
        <button type="button" id="adminAuthToggleBtn" class="btn-secondary" style="font-size: 12px; padding: 4px 10px;">輸入金鑰</button>
      </div>
    </div>
    <h1>📊 投票管理後台</h1>
    <p class="subtitle">建立投票主題與選項，產生短連結分享出去</p>

    <div class="card">
      <div id="createSection">
        <!-- AI 輔助建立區塊 -->
        <div class="ai-helper-card">
          <div class="ai-helper-header">
            <div>
              <div class="ai-helper-title">✨ AI 助理輔助建立投票</div>
              <div class="ai-helper-desc">上傳菜單、活動海報或清單截圖，自動識別主題與選項</div>
            </div>
          </div>

          <label style="margin-top:0;">1. 上傳圖片（支援 JPG/PNG/WEBP，10MB 內）</label>
          <div class="ai-upload-box" id="aiUploadDropzone">
            <input type="file" id="aiImageInput" accept="image/jpeg,image/png,image/webp" style="display:none;" />
            <div id="aiUploadPlaceholder">
              <span style="font-size: 24px;">📷</span>
              <div style="font-size: 13px; font-weight: 600; color: #6b21a8; margin-top: 4px;">點擊選擇圖片 或 拖曳圖片至此</div>
              <div style="font-size: 11px; color: #9333ea;">單張圖片，大小不超過 10MB</div>
            </div>
            <div id="aiPreviewWrap" style="display:none;" class="ai-preview-container">
              <img id="aiPreviewImg" class="ai-preview-img" alt="預覽圖" />
              <button type="button" id="aiRemoveImgBtn" class="ai-remove-img" title="移除圖片">✕</button>
            </div>
          </div>

          <label>2. 選擇 AI 模型</label>
          <div class="ai-provider-group">
            <label class="ai-provider-label checked" id="labelGemini">
              <input type="radio" name="aiProvider" value="gemini" checked />
              <div>
                <div>Google Gemini</div>
                <div style="font-size:11px; font-weight:400; color:#7e22ce;">gemini-3.6-flash</div>
              </div>
            </label>
            <label class="ai-provider-label" id="labelNvidia">
              <input type="radio" name="aiProvider" value="nvidia" />
              <div>
                <div>NVIDIA NIM</div>
                <div style="font-size:11px; font-weight:400; color:#7e22ce;">llama-3.2-90b-vision</div>
              </div>
            </label>
          </div>

          <label>3. 補充提示（選填）</label>
          <input type="text" id="aiPromptInput" placeholder="例如：只列出主餐類別、請將飲料甜點排除" style="background:#fff;" />

          <button type="button" class="btn-primary btn-ai" id="aiAnalyzeBtn">
            🪄 使用 AI 分析圖片並填入表單
          </button>
        </div>

        <label>投票主題</label>
        <input type="text" id="titleInput" placeholder="例如：本次尾牙聚餐想吃什麼？" />

        <label>投票模式</label>
        <div class="type-selector-group">
          <label class="type-card-label checked" id="labelSingle">
            <input type="radio" name="pollType" value="single" checked />
            <div class="type-card-info">
              <span class="type-card-title">🔘 單選投票</span>
              <span class="type-card-desc">每位投票者限選 1 項</span>
            </div>
          </label>
          <label class="type-card-label" id="labelMultiple">
            <input type="radio" name="pollType" value="multiple" />
            <div class="type-card-info">
              <span class="type-card-title">☑️ 複選投票</span>
              <span class="type-card-desc">每人可選多項，可自訂上限</span>
            </div>
          </label>
        </div>

        <div id="multiLimitSection" class="multi-limit-box" style="display: none;">
          <div class="multi-limit-row">
            <label style="margin: 0; font-size: 13px; font-weight: 600;">每人最多可選：</label>
            <input type="number" id="maxChoicesInput" value="2" min="2" max="2" />
            <span style="font-size: 13px; font-weight: 600;">票</span>
            <span style="font-size: 12px; color: var(--text-muted);" id="maxChoicesHint">（上限不能超過選項總數）</span>
          </div>
        </div>

        <label>選項清單</label>
        <div id="optionsList"></div>
        <button class="btn-secondary" id="addOptionBtn" type="button">+ 新增選項</button>

        <label for="noteInput">投票備註</label>
        <textarea id="noteInput" rows="3" placeholder="補充說明，例如活動規則、截止時間等（選填）"></textarea>

        <button class="btn-primary btn-block" id="createBtn">建立投票</button>
      </div>
    </div>

    <div class="card">
      <h2 style="font-size:16px; margin-top:0;">所有投票</h2>
      <div id="pollList"><div class="empty">尚未建立任何投票</div></div>
    </div>
  </div>

  <!-- 編輯備註彈跳視窗 -->
  <div class="modal-overlay" id="editNoteModal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">✏️ 編輯投票備註</div>
        <button type="button" class="btn-secondary" id="closeNoteModalBtn" style="padding: 4px 8px; font-size: 12px;">✕</button>
      </div>
      <p style="font-size: 13px; color: var(--text-muted); margin-top: 0; margin-bottom: 12px;">
        投票主題：<strong id="modalPollTitle" style="color: var(--text-main);"></strong>
      </p>
      <label for="modalNoteTextarea" style="margin-top:0;">備註說明內容（支援清空或事後補上）：</label>
      <textarea id="modalNoteTextarea" rows="4" placeholder="補充說明，例如活動規則、截止時間等（選填）"></textarea>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancelNoteModalBtn">取消</button>
        <button type="button" class="btn-primary" id="saveNoteModalBtn">儲存備註</button>
      </div>
    </div>
  </div>

  <!-- 管理金鑰認證彈窗 -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">🔐 管理者權限驗證</div>
        <button type="button" class="btn-secondary" id="closeAuthModalBtn" style="padding: 4px 8px; font-size: 12px;">✕</button>
      </div>
      <p style="font-size: 13px; color: var(--text-muted); margin-top: 0; margin-bottom: 12px;">
        本後台執行建立、編輯、刪除投票及 AI 辨識功能需驗證管理金鑰。
      </p>
      <label for="adminKeyInput" style="margin-top:0;">請輸入管理者金鑰 (ADMIN_API_KEY)：</label>
      <input type="password" id="adminKeyInput" placeholder="請輸入設定於 .env 的 ADMIN_API_KEY" style="width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1.5px solid #d1d5db; border-radius: 8px; font-size: 14px; margin-bottom: 8px;" />
      
      <div style="font-size: 12px; color: #b45309; background: #fffbeb; border: 1px solid #fef3c7; padding: 10px 12px; border-radius: 6px; margin-bottom: 16px; line-height: 1.5;">
        ⚠️ <strong>安全提醒：</strong>管理金鑰將暫存於此瀏覽器中以避免頻繁輸入；<strong>請勿在公用或他人電腦上保持登入狀態</strong>，離開前請點擊「鎖定 / 登出後台」。
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancelAuthModalBtn">取消</button>
        <button type="button" class="btn-primary" id="saveAuthModalBtn">確認解鎖</button>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
